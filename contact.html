<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Contact | Peachy Studio</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<nav class="navbar">

    <div class="container nav-inner">

        <a href="index.html" class="logo">
            <span>PEACHY</span> STUDIO
        </a>

        <button class="menu">
            ☰
        </button>

        <div class="nav">

            <a href="index.html">Home</a>

            <a href="services.html">
                Services
            </a>

            <a href="work.html">
                Work
            </a>

            <a href="process.html">
                Process
            </a>

            <a href="contact.html">
                Contact
            </a>

        </div>

    </div>

</nav>


<section class="page-hero">

    <div class="container">

        <span class="kicker">
            SAY HELLO ✦
        </span>

        <h1>
            Have an idea?
            <span class="highlight">
                Let's make it real.
            </span>
        </h1>

    </div>

</section>


<section class="section">

    <div class="container contact-box">

        <div>

            <h2>
                Start a conversation.
            </h2>

            <p>
                Tell us what you're building,
                what you need, and what you want
                people to feel when they visit.
            </p>

            <span class="tag">
                Website
            </span>

            <span class="tag">
                Brand
            </span>

            <span class="tag">
                Portfolio
            </span>

            <span class="tag">
                Landing Page
            </span>

        </div>


        <form>

            <div>

                <label for="name">
                    Name
                </label>

                <input
                    id="name"
                    required
                    placeholder="Your name">

            </div>


            <div>

                <label for="email">
                    Email
                </label>

                <input
                    id="email"
                    type="email"
                    required
                    placeholder="you@example.com">

            </div>


            <div>

                <label for="message">
                    Project idea
                </label>

                <textarea
                    id="message"
                    required
                    placeholder="Tell us a little about your project...">
                </textarea>

            </div>


            <button
                class="btn"
                type="submit">

                Send inquiry →

            </button>

        </form>

    </div>

</section>


<footer>

    <div class="container footer-grid">

        <a href="index.html" class="logo">
            <span>PEACHY</span> STUDIO
        </a>

        <div>
            © 2026 Peachy Studio
        </div>

    </div>

</footer>


<script src="script.js"></script>

</body>
</html>
